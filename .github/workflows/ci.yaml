name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {app: api, run: npm test}
          - {app: web, run: npm run build}
          - {app: worker, run: npm run check}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: ${{ matrix.run }}
      - run: npm audit --omit=dev --audit-level=high
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: false
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and smoke test
        run: |
          sh scripts/install.sh
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/api/ready
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/admin
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/metrics)" = 404
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Cleanup
        if: always()
        run: docker compose down -v
