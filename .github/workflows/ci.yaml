name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {app: api, run: npm test}
          - {app: web, run: npm test && npm run build}
          - {app: worker, run: npm run check}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: ${{ matrix.run }}
      - run: npm audit --omit=dev --audit-level=high
  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: lightning_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/lightning_test
          REDIS_HOST: 127.0.0.1
          REDIS_DB: "15"
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: false
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint installer
        run: shellcheck -s sh scripts/install.sh
      - name: Validate and smoke test
        run: |
          sh scripts/install.sh check
          sh scripts/install.sh
          sh scripts/install.sh check
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/api/ready
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/login
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/metrics)" = 404
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: End-to-end tests against the Compose stack
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BOOTSTRAP_TOKEN="$(docker compose --project-directory ../.. exec -T api node dist/cli.js bootstrap-token)" npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Cleanup
        if: always()
        run: docker compose down -v
