name: CI
# The unit jobs (API, web, worker, the six Node adapters, the Go services) need nothing but a runner: they run on
# every push to main, on pull requests and by hand. The jobs that need services or a whole Compose stack
# (api-integration, build, compose) stay manual (Actions tab -> CI -> Run workflow): they are slow, and every
# change is also tried on the demo server. The release workflow calls this file and waits for the unit jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {app: api, run: npm test}
          - {app: web, run: npm test && npm run build}
          - {app: worker, run: npm run check}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: ${{ matrix.run }}
      # High and critical advisories fail, except those scripts/audit-allowlist.json excuses: each with its reason
      # and an expiry date, and only while no unaffected release exists (scripts/audit.mjs).
      - run: node ../../scripts/audit.mjs
  # The six Node adapters have no dependencies (no lock file, nothing to install): their tests run against
  # pretend platforms (a fake API, WinRM server or virsh), never a real hypervisor.
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [proxmox, xcpng, ovirt, hyperv, libvirt, incus]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  api-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: lightning_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # servers.test.mjs needs a worker, the VMware adapter and vcsim (WORKER_TEST); it skips here and the
      # compose job covers provisioning end to end. Run it locally with the simulator stack.
      # Settings secrets (SMTP, CAPTCHA, SMS, VAPID) are encrypted with the master key; a throwaway one for the run.
      - run: head -c 32 /dev/urandom | base64 > "$RUNNER_TEMP/master.key"
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/lightning_test
          REDIS_HOST: 127.0.0.1
          REDIS_DB: "15"
          MASTER_KEY_FILE: ${{ runner.temp }}/master.key
          # No master.key on the runner; better-auth signs test cookies with this instead.
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/vmware, services/console]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # vmware: govmomi's simulator; console: a TLS WebSocket echo upstream. Neither is real VMware.
      - run: go test -count=1 ./...
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [apps/web, apps/api, apps/worker, services/vmware, services/console, services/proxmox, services/xcpng,
          services/ovirt, services/hyperv, services/libvirt, services/incus]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
  compose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The installer needs 10 GB free after the build; the runner image ships toolchains this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Lint installer
        run: shellcheck -s sh scripts/install.sh scripts/get.sh
      - name: Validate monitoring config
        run: |
          docker run --rm -v "$PWD/deploy/observability:/c:ro" --entrypoint promtool prom/prometheus:v3.2.1 check rules /c/alerts.yaml
          docker run --rm -v "$PWD/deploy/observability:/c:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /c/alertmanager.example.yml
      - name: Validate and smoke test
        run: |
          sh scripts/install.sh check
          # sudo: the secrets/ files must belong to uid 1000, the containers' user
          # --local: no public name on the runner; --setup-wizard: the E2E suite creates the admin in the browser.
          sudo sh scripts/install.sh --local --setup-wizard
          sudo sh scripts/install.sh check
          sudo docker compose -f compose.yaml -f compose.simulator.yaml up -d --build --wait
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/api/ready
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/login
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/metrics)" = 404
      - name: Backup and restore round trip
        run: |
          sudo sh scripts/install.sh backup
          file=$(sudo sh -c 'ls -1 backups/lightning-*.tar.enc | tail -n 1')
          # Without the flag nothing changes (exit 3); with it the data is replaced and the stack comes back.
          set +e; sudo sh scripts/install.sh restore "$file"; test $? -eq 3; set -e
          # --no-hold: the backup was taken a moment ago; on hold the panel shows a bar on every page, and the
          # browser tests further down expect the panel as an installation leaves it.
          sudo sh scripts/install.sh restore "$file" --yes-replace-data --no-hold
          sudo grep -c '"kind":"restore","status":"ok"' data/maintenance/history.jsonl
          # restore starts the base stack; the simulators need their overlay again
          sudo docker compose -f compose.yaml -f compose.simulator.yaml up -d --wait
      - name: Services snapshot, restart and refusals (host agent side)
        run: |
          # The snapshot the panel reads: migrate is a one-shot job others wait for, it ended with 0, and the
          # simulators (an extra compose file) are not services the agent may restart.
          sudo sh scripts/install.sh state
          sudo jq -e '.services[] | select(.service == "migrate") | .exitCode == 0 and .restartPolicy == "no" and .awaited == 1 and .managed == 1' data/maintenance/state.json
          sudo jq -e '.services[] | select(.service == "vcsim-esxi") | .managed == 0' data/maintenance/state.json
          sudo jq -e '.services[] | select(.service == "proxy") | .image == "caddy:2-alpine" and (.ports | length > 0)' data/maintenance/state.json
          sudo jq -e '.commit | length >= 7' data/maintenance/state.json
          # Refused without touching anything: the database, Redis, a one-shot restart, a name outside the file.
          for args in "restart postgres" "restart redis" "restart migrate" "run worker" "restart vcsim-esxi" "restart nope"; do
            set +e; sudo sh scripts/install.sh service $args --lang en; rc=$?; set -e
            test "$rc" -ne 0 || { echo "service $args was not refused"; exit 1; }
          done
          # A restart of a long-running service and migrate run again, each waited for and healthy afterwards.
          sudo sh scripts/install.sh service restart worker --lang en
          sudo sh scripts/install.sh service run migrate --lang en
          sudo docker compose -f compose.yaml -f compose.simulator.yaml up -d --wait
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/api/ready
      - name: Monitoring data flow
        run: |
          sudo docker compose -f compose.yaml -f compose.simulator.yaml --profile observability up -d --wait
          # The worker heartbeat travels worker -> PostgreSQL -> API metrics -> Prometheus.
          for i in $(seq 1 24); do
            curl -s --data-urlencode 'query=lightning_worker_heartbeat_age_seconds' http://127.0.0.1:9090/api/v1/query               | jq -e '.data.result[0].value[1] | tonumber < 120' >/dev/null && break
            sleep 5
          done
          curl -s --data-urlencode 'query=lightning_dependency_up' http://127.0.0.1:9090/api/v1/query | jq -e '.data.result | length == 2'
          # Targets read "unknown" until their first scrape; wait for every one to be up.
          for i in $(seq 1 24); do
            curl -s http://127.0.0.1:9090/api/v1/targets | jq -e '[.data.activeTargets[] | select(.health != "up")] | length == 0' >/dev/null && break
            sleep 5
          done
          curl -s http://127.0.0.1:9090/api/v1/targets | jq -c '.data.activeTargets[] | {job: .labels.job, health, lastError}'
          curl -s http://127.0.0.1:9090/api/v1/targets | jq -e '[.data.activeTargets[] | select(.health != "up")] | length == 0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: End-to-end tests against the Compose stack
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_VCSIM_HOST=vcsim-vcenter E2E_BOOTSTRAP_TOKEN="$(sudo docker compose --project-directory ../.. exec -T api node dist/cli.js bootstrap-token)" npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: sudo docker compose -f compose.yaml -f compose.simulator.yaml --profile observability logs --tail=80 || true
      - name: Cleanup
        if: always()
        run: sudo docker compose -f compose.yaml -f compose.simulator.yaml --profile observability down -v || true
