name: Publish containers
# A pushed v* tag: the unit jobs of ci.yaml, then the container images to ghcr.io and the GitHub Release with the
# notes of that version from CHANGELOG.md. Versions below 1.0 and tags with a suffix (-rc.1, -beta.2) are
# published as pre-releases: the project is in beta. The installer and the panel do not read GitHub's releases;
# they follow the git tags (docs/updates.md).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  # Nothing is published from a tag whose unit tests fail (the manual-only jobs of ci.yaml do not run here).
  unit:
    uses: ./.github/workflows/ci.yaml
  publish:
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {app: web, context: apps/web}
          - {app: api, context: apps/api}
          - {app: worker, context: apps/worker}
          - {app: vmware, context: services/vmware}
          - {app: console, context: services/console}
          - {app: proxmox, context: services/proxmox}
          - {app: xcpng, context: services/xcpng}
          - {app: ovirt, context: services/ovirt}
          - {app: hyperv, context: services/hyperv}
          - {app: libvirt, context: services/libvirt}
          - {app: incus, context: services/incus}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
  # The release page of the tag. Only this job may write to the repository, and only after the unit jobs passed.
  release:
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notes of this version from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next version's heading (or the link list at the end).
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]*\]: http/ { if (found) exit }
            found { print }' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version: write it before tagging" >&2; exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "**Install** on a fresh Ubuntu 22.04 / 24.04 / 26.04 server:"
            echo
            echo '```sh'
            echo "curl -fsSL https://lightningvm.app/install.sh | sudo sh -s -- --version $GITHUB_REF_NAME"
            echo '```'
            echo
            echo "**Update** an installed panel: Admin → System → Updates, or \`sudo sh scripts/install.sh update --to $GITHUB_REF_NAME\`. Read [docs/upgrade-notes.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/upgrade-notes.md) first."
            echo
            echo "Full list of changes: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
          } >> notes.md
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            v0.*|*-*) pre=true; title="Lightning VM $GITHUB_REF_NAME (beta)" ;;
            *) pre=false; title="Lightning VM $GITHUB_REF_NAME" ;;
          esac
          # Run again for the same tag (a re-run of the workflow), it brings the existing release up to date.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --prerelease="$pre"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes-file notes.md --prerelease="$pre"
          fi
