version: 2
updates:
  - package-ecosystem: npm
    directories: [/apps/api, /apps/web, /apps/worker]
    schedule: {interval: weekly}
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories: [/services/vmware, /services/console]
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/worker, /services/vmware, /services/console, /deploy/simulator]
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
