name: Özellik isteği / Feature request
description: Bir fikir ya da iyileştirme önerin / Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi sorunu çözüyor? / What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Öneriniz / Your suggestion
  - type: dropdown
    id: area
    attributes:
      label: Alan / Area
      options: [Müşteri paneli / Customer panel, Yönetici paneli / Admin panel, VMware, Kurulum ve güncelleme / Install and update, Faturalama / Billing, Diğer / Other]
