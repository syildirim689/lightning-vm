# Container logs -> Loki. Docker's json-file lines carry the Compose service name (compose.yaml
# logging.labels), which becomes service.name, Loki's main label. Other containers on the host have no
# such label and are dropped. The applications already omit secrets; the masking below is a second net.
extensions:
  file_storage:
    directory: /var/lib/otelcol
receivers:
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    storage: file_storage
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
      - type: filter
        expr: 'attributes.attrs == nil or attributes.attrs["com.docker.compose.service"] == nil'
      - type: move
        from: attributes.attrs["com.docker.compose.service"]
        to: resource["service.name"]
      - type: move
        from: attributes.log
        to: body
      - type: remove
        field: attributes.attrs
      - type: remove
        field: attributes.time
      # Application lines are JSON themselves: keep level and event code as attributes.
      - type: json_parser
        if: 'body matches "^\\s*\\{"'
        parse_from: body
        parse_to: attributes.app
        on_error: send_quiet
      - type: severity_parser
        if: 'attributes.app != nil and attributes.app.level != nil'
        parse_from: attributes.app.level
        on_error: send_quiet
      - type: copy
        if: 'attributes.app != nil and attributes.app.event != nil'
        from: attributes.app.event
        to: attributes.event
      - type: remove
        if: 'attributes.app != nil'
        field: attributes.app
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  transform/mask:
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "(?i)(\"?(password|passwd|secret|token|ticket|cookie|authorization)\"?\\s*[:=]\\s*\"?)[^\",\\s}]+", "$${1}***")
  batch: {}
exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, transform/mask, batch]
      exporters: [otlphttp/loki]
