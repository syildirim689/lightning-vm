global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: lightning-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:4000]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  # The panel as a user reaches it; the target file is written at start from PANEL_PROBE_URL.
  - job_name: probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/prometheus/probe-targets.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
